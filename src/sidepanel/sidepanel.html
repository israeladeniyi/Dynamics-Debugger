<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D365 Trace Viewer</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="header">
      <h1>D365 Trace Viewer</h1>
      <span id="version" class="version"></span>
    </header>

    <section class="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">Not recording</span>
    </section>

    <section class="env" aria-live="polite">
      <h2>Environment</h2>
      <p id="env-name" class="env-name">Checking…</p>
      <p id="env-detail" class="hint"></p>
      <div id="env-allow" class="env-allow" hidden>
        <p id="env-allow-text"></p>
        <button id="env-allow-button" type="button"></button>
      </div>
    </section>

    <main class="empty">
      <p>Recording arrives in the next milestone.</p>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
