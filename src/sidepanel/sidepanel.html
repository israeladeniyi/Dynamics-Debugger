<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D365 Trace Viewer</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="header">
      <h1>D365 Trace Viewer</h1>
      <span id="version" class="version"></span>
    </header>

    <section id="status" class="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">Not recording</span>
    </section>

    <section class="env" aria-live="polite">
      <h2>Environment</h2>
      <p id="env-name" class="env-name">Checking…</p>
      <p id="env-detail" class="hint"></p>
      <div id="env-allow" class="env-allow" hidden>
        <p id="env-allow-text"></p>
        <button id="env-allow-button" type="button"></button>
      </div>
    </section>

    <section class="controls" aria-label="Recording controls">
      <button id="btn-start" type="button">Start</button>
      <button id="btn-pause" type="button">Pause</button>
      <button id="btn-resume" type="button">Resume</button>
      <button id="btn-stop" type="button">Stop</button>
      <button id="btn-clear" type="button">Clear</button>
    </section>
    <p id="control-message" class="hint" aria-live="polite"></p>

    <main>
      <div class="list-header">
        <h2>Captured requests</h2>
        <label class="hint">Show
          <select id="filter">
            <option value="activity" selected>Data activity</option>
            <option value="dataverse">All Dataverse</option>
            <option value="all">All requests</option>
          </select>
        </label>
      </div>
      <div class="count-row">
        <p id="count" class="hint"></p>
        <span id="copy-status" class="hint" aria-live="polite"></span>
        <button id="btn-copy" type="button" title="Copy the listed requests as tab-separated text" disabled>Copy</button>
      </div>
      <table id="requests" class="requests">
        <thead>
          <tr><th>Time</th><th>Operation</th><th>Target</th><th>Status</th><th>ms</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="empty" class="empty">Press Start, then use Dynamics as normal. Requests appear here.</p>
    </main>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
